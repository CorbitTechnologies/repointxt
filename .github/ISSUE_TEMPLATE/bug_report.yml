name: Bug Report
description: File a bug report to help us improve repointxt
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please ensure you are testing on the latest version of [repointxt.corbit.tech](https://repointxt.corbit.tech).
  - type: input
    id: repo-url
    attributes:
      label: Repository URL or Slug
      description: The GitHub repository that reproduced the problem (e.g. facebook/react)
      placeholder: owner/repo
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser & OS
      description: Which browser and operating system were you using?
      options:
        - Chrome / Chromium (macOS)
        - Chrome / Chromium (Windows)
        - Chrome / Chromium (Linux)
        - Safari (macOS / iOS)
        - Firefox (macOS)
        - Firefox (Windows)
        - Firefox (Linux)
        - Other
    validations:
      required: true
  - type: checkboxes
    id: privacy-confirmation
    attributes:
      label: Privacy Check
      options:
        - label: I confirm this report does NOT contain private GitHub Personal Access Tokens or proprietary code secrets.
          required: true
