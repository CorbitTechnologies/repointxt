name: Feature Request
description: Suggest an idea, LLM model preset, or workflow optimization for repointxt
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We love hearing developer suggestions! Please describe how your idea helps engineers pack context faster and more cleanly.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is (e.g. "I'm always exceeding Claude's 200k limit when packing Monorepo X...").
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Any alternative solutions or workarounds you've used.
    validations:
      required: false
